<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Player Sin Anuncios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            color: #00ff66;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        .header p {
            font-size: 13px;
            color: #aaaaaa;
            margin-top: 6px;
        }

        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 420px;
        }

        .btn-play {
            background: #121212;
            border: 2px solid #00ff66;
            border-radius: 14px;
            padding: 20px 24px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }

        .btn-play:active {
            background: #00ff66;
            color: #000000;
            transform: scale(0.97);
        }

        .icon {
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>CAR PLAYER PRO</h1>
        <p>Videoclips directos sin publicidad</p>
    </div>

    <div class="grid-container">
        <!-- Servidor Principal (Invidious - Sin publicidad) -->
        <a class="btn-play" href="https://yewtu.be/playlist?list=PLPBl-I93G56Y">
            <span>▶ LISTA SIN ANUNCIOS</span>
            <span class="icon">⚡</span>
        </a>

        <!-- Servidor Secundario de respaldo por si el primero se satura -->
        <a class="btn-play" href="https://piped.video/playlist?list=PLPBl-I93G56Y" style="border-color: #ff3333;">
            <span>🔄 OPCIÓN B (PIPED)</span>
            <span class="icon">🚀</span>
        </a>
    </div>

</body>
</html>
