
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi música</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #111318;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 850px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    #status {
      color: #aaa;
      margin-bottom: 20px;
    }

    #search {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px solid #383b44;
      border-radius: 10px;
      background: #20232b;
      color: white;
      font-size: 16px;
    }

    #songs {
      display: grid;
      gap: 10px;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      background: #20232b;
      border-radius: 10px;
    }

    .song img {
      width: 112px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 6px;
      background: #333;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .artist {
      margin-top: 6px;
      color: #aaa;
      font-size: 14px;
    }

    button {
      padding: 11px 15px;
      border: 0;
      border-radius: 8px;
      background: #b8f500;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #d0ff51;
    }

    @media (max-width: 500px) {
      body {
        padding: 14px;
      }

      .song {
        gap: 10px;
      }

      .song img {
        width: 85px;
      }

      button {
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1 id="playlist-title">Mi música</h1>
    <p id="status">Cargando canciones...</p>

    <input
      id="search"
      type="search"
      placeholder="Buscar canción o artista..."
      autocomplete="off"
    >

    <div id="songs"></div>
  </main>

  <script>
    "use strict";

    const statusElement = document.getElementById("status");
    const songsElement = document.getElementById("songs");
    const searchElement = document.getElementById("search");
    const titleElement = document.getElementById("playlist-title");

    let items = [];

    function getPlaybackUrl(item) {
      // Utiliza el enlace guardado en lista.json.
      // Si no existe, genera uno compatible con el formato solicitado.
      let originalUrl = item.url;

      if (!originalUrl && item.id) {
        originalUrl =
          "https://www.youtube.com/watch?v=" +
          encodeURIComponent(item.id) +
          "&list=RD" +
          encodeURIComponent(item.id) +
          "&start_radio=1";
      }

      if (!originalUrl) {
        throw new Error("La canción no tiene enlace ni ID.");
      }

      let url;

      try {
        url = new URL(originalUrl);
      } catch {
        throw new Error("El enlace de la canción no es válido.");
      }

      // Solo aceptamos enlaces de YouTube o yout-ube.com.
      const host = url.hostname.toLowerCase();

      const validHosts = [
        "youtube.com",
        "www.youtube.com",
        "m.youtube.com",
        "yout-ube.com",
        "www.yout-ube.com"
      ];

      if (!validHosts.includes(host)) {
        throw new Error("El dominio del enlace no es válido.");
      }

      // Cambia exclusivamente el dominio.
      // Los parámetros v, list y start_radio se conservan.
      url.protocol = "https:";
      url.hostname = "www.yout-ube.com";
      url.hash = "";

      return url.toString();
    }

    function playSong(item) {
      try {
        const destination = getPlaybackUrl(item);
        window.location.assign(destination);
      } catch (error) {
        statusElement.textContent = error.message;
      }
    }

    function renderSongs(query = "") {
      songsElement.replaceChildren();

      const normalizedQuery = query
        .trim()
        .toLocaleLowerCase("es");

      const filtered = items.filter(item => {
        const text = (
          (item.title || "") + " " + (item.by || "")
        ).toLocaleLowerCase("es");

        return text.includes(normalizedQuery);
      });

      if (filtered.length === 0) {
        const message = document.createElement("p");
        message.textContent = "No se han encontrado canciones.";
        songsElement.appendChild(message);
        return;
      }

      const fragment = document.createDocumentFragment();

      filtered.forEach(item => {
        const row = document.createElement("article");
        row.className = "song";

        const image = document.createElement("img");
        image.src = item.thumb ||
          `https://i.ytimg.com/vi/${encodeURIComponent(item.id)}/hqdefault.jpg`;
        image.alt = "";
        image.loading = "lazy";

        image.addEventListener("error", () => {
          image.style.visibility = "hidden";
        }, { once: true });

        const info = document.createElement("div");
        info.className = "info";

        const songTitle = document.createElement("div");
        songTitle.className = "title";
        songTitle.textContent = item.title || "Vídeo sin título";

        const artist = document.createElement("div");
        artist.className = "artist";
        artist.textContent = item.by || "";

        info.append(songTitle, artist);

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "Reproducir";
        button.addEventListener("click", () => playSong(item));

        row.append(image, info, button);
        fragment.appendChild(row);
      });

      songsElement.appendChild(fragment);
    }

    async function loadPlaylist() {
      try {
        const response = await fetch("./lista.json", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            `No se pudo cargar lista.json (HTTP ${response.status}).`
          );
        }

        const data = await response.json();

        if (!Array.isArray(data.items)) {
          throw new Error("lista.json no contiene una lista de canciones válida.");
        }

        items = data.items.filter(item => item && item.id);

        if (items.length === 0) {
          throw new Error("No hay canciones en lista.json.");
        }

        titleElement.textContent = data.title || "Mi música";
        statusElement.textContent =
          `${items.length} canciones disponibles`;

        renderSongs();
      } catch (error) {
        statusElement.textContent =
          "Error al cargar la lista: " + error.message;
      }
    }

    searchElement.addEventListener("input", () => {
      renderSongs(searchElement.value);
    });

    loadPlaylist();
  </script>
</body>
</html>
