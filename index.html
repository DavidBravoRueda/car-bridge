<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Spotify Web</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            background: #121212;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .spotify-logo {
            font-size: 50px;
            margin-bottom: 20px;
        }

        h2 {
            color: #1ed760;
            margin-bottom: 10px;
            font-size: 22px;
        }

        p {
            color: #b3b3b3;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .btn-launch {
            background-color: #1ed760;
            color: #000000;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(30, 215, 96, 0.4);
            transition: transform 0.1s;
        }

        .btn-launch:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spotify-logo">🟢</div>
        <h2>Spotify Web Launcher</h2>
        <p>Pulsa el botón para abrir el navegador externo y acceder a tu música sin bloqueos.</p>
        
        <!-- Al pulsar, abre la web oficial en una pestaña/navegador independiente -->
        <a href="https://open.spotify.com" target="_blank" class="btn-launch">Abrir Spotify Web</a>
    </div>

</body>
</html>
