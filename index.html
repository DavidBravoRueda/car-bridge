<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Player - YouTube Clean</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        h1 {
            font-size: 1.4rem;
            color: #e50914;
            margin-bottom: 15px;
        }
        .search-box {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #1a1a1a;
            color: #fff;
            font-size: 1rem;
        }
        button {
            padding: 12px 18px;
            border-radius: 8px;
            border: none;
            background-color: #e50914;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .player-container {
            width: 100%;
            max-width: 700px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .quick-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 600px;
        }
        .btn-link {
            background-color: #1f1f1f;
            color: #fff;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <h1>Car Clean Player</h1>

    <!-- Buscador o pegador de ID de vídeo -->
    <div class="search-box">
        <input type="text" id="videoInput" placeholder="Pega ID del vídeo o enlace...">
        <button onclick="cargarVideo()">Cargar</button>
    </div>

    <!-- Reproductor incrustado sin anuncios -->
    <div class="player-container">
        <iframe id="videoPlayer" src="https://yewtu.be/embed/XqZsoesa55w?autoplay=1" allowfullscreen></iframe>
    </div>

    <div class="quick-links">
        <a href="https://yewtu.be" target="_blank" class="btn-link">🔗 Abrir Buscador Completo (Invidious)</a>
        <a href="https://piped.video" target="_blank" class="btn-link">🔗 Abrir Servidor Alternativo (Piped)</a>
    </div>

    <script>
        function cargarVideo() {
            var val = document.getElementById('videoInput').value.trim();
            var videoId = val;

            // Extraer ID si pegas una URL completa de YouTube
            if (val.includes("v=")) {
                videoId = val.split("v=")[1].split("&")[0];
            } else if (val.includes("youtu.be/")) {
                videoId = val.split("youtu.be/")[1].split("?")[0];
            }

            if (videoId) {
                // Carga el vídeo a través de la instancia limpia y sin anuncios de Invidious
                document.getElementById('videoPlayer').src = "https://yewtu.be/embed/" + videoId + "?autoplay=1";
            }
        }
    </script>

</body>
</html>
