<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>El Biza</title>
<style>
:root{--bg:#0f0f0f;--chip:#272727;--hover:#272727;--ink:#f1f1f1;--muted:#aaa;--line:#303030;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #3ea6ff;outline-offset:2px}
.i{width:24px;height:24px;fill:currentColor;flex:none}
.top{position:sticky;top:0;z-index:5;height:56px;background:var(--bg);display:flex;align-items:center;gap:16px;padding:0 16px}
.ic{width:40px;height:40px;border:0;border-radius:50%;background:none;display:grid;place-items:center}
.ic:hover{background:var(--hover)}
.logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px;letter-spacing:-.5px}
.lg{width:30px;height:21px;background:#f00;border-radius:6px;display:grid;place-items:center}
.lg .i{width:14px;height:14px;fill:#fff}
.search{flex:1;max-width:640px;margin:0 auto;display:flex;height:40px}
.search input{flex:1;min-width:0;background:#121212;border:1px solid var(--line);border-right:0;border-radius:40px 0 0 40px;padding:0 16px}
.search span{width:64px;background:#222;border:1px solid var(--line);border-radius:0 40px 40px 0;display:grid;place-items:center}
.av{width:32px;height:32px;border-radius:50%;background:#1e6fd9;display:grid;place-items:center;font-weight:600;flex:none}
.nav{position:fixed;top:56px;left:0;bottom:0;width:240px;padding:12px;background:var(--bg);transform:translateX(-100%);transition:transform .18s;z-index:4;overflow:auto}
body.nav-open .nav{transform:none}
.nav button{display:flex;align-items:center;gap:22px;width:100%;padding:0 12px;height:40px;border:0;border-radius:10px;background:none;text-align:left}
.nav button:hover,.nav .act{background:var(--hover)}
.nav hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.page{display:grid;grid-template-columns:clamp(300px,32%,420px) 1fr;gap:24px;padding:16px 24px 40px;transition:margin-left .18s}
@media (min-width:1100px){body.nav-open .page{margin-left:240px}}
@media (max-width:820px){.page{grid-template-columns:1fr;padding:12px}}
.card{background:linear-gradient(180deg,#4a4a4c 0%,#262626 55%,#1c1c1c 100%);border-radius:24px;padding:24px;align-self:start;position:sticky;top:72px}
@media (max-width:820px){.card{position:static}}
.cover{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}
.cover img,.cover video{width:100%;height:100%;object-fit:cover;display:block}
.cover video{object-fit:contain}
h1{font-size:32px;line-height:1.15;margin:20px 0 12px;font-weight:700}
.by{display:flex;align-items:center;gap:8px;font-weight:600}
.by .av{width:28px;height:28px;font-size:14px}
.meta{color:#d0d0d0;font-size:14px;margin:12px 0 4px}
.desc{color:#d0d0d0;font-size:14px;margin:12px 0 16px}
.acts{display:flex;gap:10px;align-items:center}
.white{display:flex;align-items:center;gap:6px;height:48px;padding:0 24px 0 16px;border:0;border-radius:999px;background:#f1f1f1;color:#0f0f0f;font-weight:600;font-size:16px}
.round{width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.round:hover{background:rgba(255,255,255,.2)}
.round[aria-pressed="true"]{background:#f1f1f1;color:#0f0f0f}
#now{margin-top:16px}
#nt{font-weight:600;margin-bottom:10px}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctrl button{height:48px;border:0;border-radius:999px;background:rgba(255,255,255,.12);font-weight:600}
#msg{min-height:20px;margin-top:12px;font-size:13px;color:#d0d0d0}
.chips{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.chip,select{height:40px;border:0;border-radius:10px;background:var(--chip);padding:0 16px;font-weight:500}
.chip.on{background:#f1f1f1;color:#0f0f0f}
select{padding-right:12px}
ul{list-style:none;margin:0;padding:0}
#list.rev{display:flex;flex-direction:column-reverse}
li{content-visibility:auto;contain-intrinsic-size:auto 112px}
li[hidden]{display:none}
.row{display:grid;grid-template-columns:40px 168px 1fr 40px;gap:12px;align-items:start;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:8px 4px}
.row:hover,.row.on{background:var(--hover)}
.n{color:var(--muted);text-align:center;align-self:center}
.th{position:relative;display:block;aspect-ratio:16/9;background:#222;border-radius:10px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th em{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.8);font-style:normal;font-size:12px;font-weight:500;padding:1px 4px;border-radius:4px}
.tx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:18px;font-weight:500;line-height:1.3}
.tx small{display:block;margin-top:6px;color:var(--muted);font-size:14px}
.dots{align-self:center;opacity:.85}
@media (max-width:560px){.row{grid-template-columns:28px 120px 1fr}.dots{display:none}.tx b{font-size:15px}h1{font-size:26px}}
dialog{background:#212121;color:var(--ink);border:0;border-radius:16px;padding:20px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 12px;font-size:20px}
dialog label{display:block;margin-top:10px;font-size:14px;color:var(--muted)}
dialog input{width:100%;margin-top:4px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#121212}
.dl{display:flex;gap:10px;margin-top:16px}
.dl button{flex:1;height:44px;border:0;border-radius:999px;background:#3a3a3a;font-weight:600}
.dl #save{background:#f1f1f1;color:#0f0f0f}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true">
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M12 4.33l7 6.12V20h-4v-6H9v6H5v-9.55l7-6.12M12 3L4 10v11h6v-6h4v6h6V10l-8-7z"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
<symbol id="i-shuf" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.61 3.61 0 0112 15.6z"/></symbol>
<symbol id="i-dots" viewBox="0 0 24 24"><path d="M12 8a2 2 0 100-4 2 2 0 000 4zm0 2a2 2 0 100 4 2 2 0 000-4zm0 6a2 2 0 100 4 2 2 0 000-4z"/></symbol>
</svg>

<header class="top">
  <button class="ic" id="burger" type="button" aria-label="Menú"><svg class="i"><use href="#i-menu"/></svg></button>
  <div class="logo"><span class="lg"><svg class="i"><use href="#i-play"/></svg></span>MiTube</div>
  <form class="search" onsubmit="return false" role="search">
    <input id="q" type="search" placeholder="Buscar" aria-label="Buscar en la lista" autocomplete="off">
    <span><svg class="i"><use href="#i-search"/></svg></span>
  </form>
  <div class="av" id="av1">D</div>
</header>

<nav class="nav" id="nav" aria-label="Menú">
  <button type="button" id="nHome" class="act"><svg class="i"><use href="#i-home"/></svg>Mi lista</button>
  <button type="button" id="nShuf"><svg class="i"><use href="#i-shuf"/></svg><span id="nShufT">Aleatorio: sí</span></button>
</nav>

<main class="page">
  <section class="card">
    <div class="cover"><img id="cimg" alt=""><video id="v" controls playsinline hidden></video></div>
    <h1 id="name">El Biza Alhaurino</h1>
    <div class="by"><span class="av" id="av2">D</span><span id="author">de David Bravo Rueda</span></div>
    <p class="meta" id="info">Lista de reproducción • Público • 2369 vídeos</p>
    <p class="desc" id="desc">Converted from Spotify by Playlist Buddy</p>
    <div class="acts">
      <button class="white" id="play" type="button"><svg class="i"><use href="#i-play"/></svg>Reproducir</button>
      <button class="round" id="shufT" type="button" aria-pressed="true" aria-label="Aleatorio" title="Aleatorio"><svg class="i"><use href="#i-shuf"/></svg></button>
    </div>
    <div id="now" hidden>
      <div id="nt"></div>
      <div class="ctrl"><button id="prev" type="button">Anterior</button><button id="next" type="button">Siguiente</button></div>
    </div>
    <div id="msg" role="status"></div>
  </section>

  <section>
    <div class="chips">
      <select id="sort" aria-label="Ordenar">
        <option value="new">Fecha de inclusión (más recientes)</option>
        <option value="old">Fecha de inclusión (más antiguos)</option>
      </select>
      <button class="chip on" data-f="all" type="button">Todo</button>
      <button class="chip" data-f="vid" type="button">Vídeos</button>
      <button class="chip" data-f="sh" type="button">Shorts</button>
    </div>
    <ul id="list" aria-label="Canciones de la lista"></ul>
  </section>
</main>

<script>
(function(){
var ID="PLPBl-I93G56Y";
var APIS=["https://pipedapi.kavin.rocks","https://pipedapi.adminforge.de","https://api.piped.private.coffee","https://pipedapi.leptons.xyz","https://pipedapi.nosebs.ru","https://pipedapi.drgns.space"];
var $=function(i){return document.getElementById(i)},v=$("v"),listEl=$("list");
function ld(k){try{return localStorage.getItem("rp:"+k)}catch(e){return null}}
function sv(k,x){try{localStorage.setItem("rp:"+k,x)}catch(e){}}
function parseId(s){s=(s||"").trim();var m=s.match(/[?&]list=([A-Za-z0-9_-]+)/);if(m)return m[1];return /^[A-Za-z0-9_-]{10,}$/.test(s)?s:""}
var API=ld("api")||APIS[0];
var items=[],lis=[],rows=[],order=[],pos=0,fails=0,shuffleOn=true,total=0,filt="all",q="";

if(innerWidth>=1100)document.body.classList.add("nav-open");
$("burger").onclick=function(){document.body.classList.toggle("nav-open")};
$("nHome").onclick=function(){scrollTo({top:0,behavior:"smooth"})};

function say(t){$("msg").textContent=t}
function vid(u){var m=/[?&]v=([\w-]{11})/.exec(u||"");return m?m[1]:null}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function dur(s){s=Math.max(0,s|0);var h=(s/3600)|0,m=((s%3600)/60)|0,x=s%60;return (h?h+":"+(m<10?"0":""):"")+m+":"+(x<10?"0":"")+x}
function fmtN(n){if(!(n>=0))return "";var u="",x=n;if(n>=1e6){x=n/1e6;u=" M"}else if(n>=1e3){x=n/1e3;u=" K"}
  var t=(u&&x<10?x.toFixed(1):String(Math.round(x))).replace(".",",");return t.replace(",0","")+u}
function ago(ts){if(!(ts>0))return "";var m=(Date.now()-ts)/6e4,h=m/60,d=h/24;
  if(m<60)return "hace "+Math.max(1,m|0)+" min";if(h<24)return "hace "+(h|0)+" h";if(d<30)return "hace "+(d|0)+" d";
  if(d<365)return "hace "+((d/30)|0)+" m";return "hace "+((d/365)|0)+" a"}
async function one(base,path){var c=new AbortController(),t=setTimeout(function(){c.abort()},7000);
  try{var r=await fetch(base+path,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
async function getJSON(path){
  var list=[API].concat(APIS.filter(function(a){return a!==API}));
  for(var i=0;i<list.length;i++){
    try{var d=await one(list[i],path);if(list[i]!==API){API=list[i];sv("api",API)}return d}catch(e){}
  }
  throw new Error("sin servidor");
}

function apply(){
  items.forEach(function(it,i){
    var ok=(filt==="all"||(filt==="vid"&&!it.short)||(filt==="sh"&&it.short))&&(!q||(it.title+" "+it.by).toLowerCase().indexOf(q)>-1);
    lis[i].hidden=!ok;
  });
}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function addRows(list){
  var f=document.createDocumentFragment();
  list.forEach(function(s){
    var idx=items.length;items.push(s);
    var li=document.createElement("li"),b=mk("button","row");b.type="button";b.dataset.i=idx;
    var th=mk("span","th");
    if(s.thumb){var im=document.createElement("img");im.loading="lazy";im.alt="";im.src=s.thumb;th.appendChild(im)}
    if(s.dur>0)th.appendChild(mk("em",null,dur(s.dur)));
    var tx=mk("span","tx");tx.appendChild(mk("b",null,s.title));
    tx.appendChild(mk("small",null,[s.by,fmtN(s.views),ago(s.up)].filter(Boolean).join(" • ")));
    var dots=mk("span","dots");dots.innerHTML='<svg class="i" aria-hidden="true"><use href="#i-dots"/></svg>';
    b.appendChild(mk("span","n",idx+1));b.appendChild(th);b.appendChild(tx);b.appendChild(dots);
    li.appendChild(b);f.appendChild(li);lis[idx]=li;rows[idx]=b;
    if(order.length){if(shuffleOn){order.splice(pos+1+Math.floor(Math.random()*(order.length-pos)),0,idx)}else order.push(idx)}
  });
  listEl.appendChild(f);apply();
}
function conv(d){return (d.relatedStreams||[]).map(function(s){var k=vid(s.url);
  return k?{id:k,title:s.title||"Sin título",by:s.uploaderName||"",thumb:s.thumbnail||"",dur:s.duration||0,views:s.views,up:s.uploaded,short:!!s.isShort||(s.duration>0&&s.duration<=60)}:null}).filter(Boolean)}
function head(){$("info").textContent="Lista de reproducción • Público • "+(total||items.length)+" vídeos"}

async function load(){
  say("Cargando la lista…");
  try{
    var r=await fetch("lista.json?"+Date.now());if(!r.ok)throw new Error(r.status);
    var d=await r.json();
    if(d.title){$("name").textContent=d.title;document.title=d.title}
    if(d.uploader){$("author").textContent="de "+d.uploader;$("av2").textContent=$("av1").textContent=d.uploader.charAt(0).toUpperCase()}
    var list=(d.items||[]).slice().reverse().map(function(s){return {id:s.id,title:s.title||"Sin título",by:s.by||"",thumb:"https://i.ytimg.com/vi/"+s.id+"/mqdefault.jpg",dur:s.dur||0,views:s.views,up:0,short:s.dur>0&&s.dur<=60}});
    total=list.length;addRows(list);head();
    $("cimg").src=list[0]?list[0].thumb:"";
    say(list.length?"":"La lista aún está vacía. En GitHub, ejecuta la acción “Actualizar lista”.");
  }catch(e){say("No se ha podido leer la lista. Comprueba que lista.json está junto a index.html.")}
}

function pick(s){
  var c=(s.videoStreams||[]).filter(function(x){return !x.videoOnly&&/mp4/i.test(x.mimeType||x.format||"")});
  c.sort(function(a,b){return (b.height||parseInt(b.quality)||0)-(a.height||parseInt(a.quality)||0)});
  return c.length?c[0].url:(s.hls||null);
}
function skip(){fails++;if(fails>=5){say("Fallan varios vídeos seguidos. Toca Siguiente para probar otro.");return}setTimeout(function(){play(pos+1)},600)}
async function play(p){
  if(!order.length)return;
  pos=(p+order.length)%order.length;
  var i=order[pos],it=items[i];
  rows.forEach(function(r){r.classList.remove("on")});
  if(rows[i]){rows[i].classList.add("on");rows[i].scrollIntoView({block:"nearest",behavior:"smooth"})}
  $("now").hidden=false;$("nt").textContent=it.title;
  $("cimg").hidden=true;v.hidden=false;
  try{
    var s=await getJSON("/streams/"+it.id),u=pick(s);
    if(!u)throw new Error("sin vídeo");
    v.src=u;await v.play().catch(function(){});
    if("mediaSession" in navigator){
      navigator.mediaSession.metadata=new MediaMetadata({title:it.title,artist:it.by});
      navigator.mediaSession.setActionHandler("nexttrack",function(){play(pos+1)});
      navigator.mediaSession.setActionHandler("previoustrack",function(){play(pos-1)});
    }
  }catch(e){skip()}
}
function startAt(first){
  var all=items.map(function(_,i){return i});
  if(shuffleOn){var rest=all.filter(function(i){return i!==first});order=first>=0?[first].concat(shuffle(rest)):shuffle(all)}
  else{order=first>=0?all.slice(first).concat(all.slice(0,first)):all}
  fails=0;play(0);
}
function toggleShuf(){shuffleOn=!shuffleOn;$("shufT").setAttribute("aria-pressed",shuffleOn);$("nShufT").textContent="Aleatorio: "+(shuffleOn?"sí":"no")}
listEl.addEventListener("click",function(e){var b=e.target.closest(".row");if(b)startAt(+b.dataset.i)});
$("play").onclick=function(){if(!items.length){load();return}startAt(-1)};
$("shufT").onclick=toggleShuf;$("nShuf").onclick=toggleShuf;
$("next").onclick=function(){play(pos+1)};$("prev").onclick=function(){play(pos-1)};
$("sort").onchange=function(){listEl.classList.toggle("rev",this.value==="old")};
document.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){
  document.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on")});c.classList.add("on");filt=c.dataset.f;apply()}});
$("q").addEventListener("input",function(){q=this.value.trim().toLowerCase();apply()});
v.addEventListener("playing",function(){fails=0;say("")});
v.addEventListener("ended",function(){play(pos+1)});
v.addEventListener("error",function(){if(v.getAttribute("src"))skip()});
load();
})();
</script>
</body>
</html>
