
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>El Biza biza</title>
<style>
:root {
  --bg:#0f0f0f; --chip:#272727; --ink:#f1f1f1;
  --muted:#aaa; --line:#303030; color-scheme:dark;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.4 Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
button,input,select { font:inherit; color:inherit; }
button { cursor:pointer; }
.i { width:24px; height:24px; fill:currentColor; flex:none; }
.top {
  position:sticky; top:0; z-index:5; height:56px; background:var(--bg);
  display:flex; align-items:center; gap:16px; padding:0 16px;
}
.ic {
  width:40px; height:40px; border:0; border-radius:50%;
  background:none; display:grid; place-items:center;
}
.ic:hover { background:#272727; }
.logo { display:flex; align-items:center; gap:6px; font-weight:700; font-size:20px; }
.lg { width:30px; height:21px; background:#f00; border-radius:6px; display:grid; place-items:center; }
.lg .i { width:14px; height:14px; fill:#fff; }
.search { flex:1; max-width:640px; margin:0 auto; display:flex; height:40px; }
.search input {
  flex:1; min-width:0; background:#121212; border:1px solid var(--line);
  border-right:0; border-radius:40px 0 0 40px; padding:0 16px;
}
.search span {
  width:64px; background:#222; border:1px solid var(--line);
  border-radius:0 40px 40px 0; display:grid; place-items:center;
}
.av {
  width:32px; height:32px; border-radius:50%; background:#1e6fd9;
  display:grid; place-items:center; font-weight:600; flex:none;
}
.nav {
  position:fixed; top:56px; left:0; bottom:0; width:240px; padding:12px;
  background:var(--bg); transform:translateX(-100%); transition:transform .18s;
  z-index:4; overflow:auto;
}
body.nav-open .nav { transform:none; }
.nav button {
  display:flex; align-items:center; gap:22px; width:100%; padding:0 12px;
  height:40px; border:0; border-radius:10px; background:none; text-align:left;
}
.nav button:hover,.nav .act { background:#272727; }
.page {
  display:grid; grid-template-columns:clamp(300px,32%,420px) 1fr;
  gap:24px; padding:16px 24px 40px;
}
@media(min-width:1100px) { body.nav-open .page { margin-left:240px; } }
@media(max-width:820px) { .page { grid-template-columns:1fr; padding:12px; } }
.card {
  background:linear-gradient(180deg,#4a4a4c 0%,#262626 55%,#1c1c1c 100%);
  border-radius:24px; padding:24px; align-self:start; position:sticky; top:72px;
}
@media(max-width:820px) { .card { position:static; } }
.cover { aspect-ratio:16/9; border-radius:16px; overflow:hidden; background:#000; }
.cover img { width:100%; height:100%; object-fit:cover; display:block; }
h1 { font-size:32px; line-height:1.15; margin:20px 0 12px; }
.by { display:flex; align-items:center; gap:8px; font-weight:600; }
.by .av { width:28px; height:28px; font-size:14px; }
.meta,.desc { color:#d0d0d0; font-size:14px; margin:12px 0; }
.acts { display:flex; gap:10px; align-items:center; }
.white {
  display:flex; align-items:center; gap:6px; height:48px; padding:0 24px 0 16px;
  border:0; border-radius:999px; background:#f1f1f1; color:#0f0f0f; font-weight:600;
}
.round {
  width:48px; height:48px; border:0; border-radius:50%;
  background:#ffffff1f; display:grid; place-items:center;
}
.round[aria-pressed="true"] { background:#f1f1f1; color:#0f0f0f; }
#now { margin-top:16px; }
#nt { font-weight:600; margin-bottom:10px; }
.ctrl { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ctrl button {
  height:48px; border:0; border-radius:999px; background:#ffffff1f; font-weight:600;
}
#msg { min-height:20px; margin-top:12px; font-size:13px; color:#d0d0d0; }
.chips { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.chip,select {
  height:40px; border:0; border-radius:10px; background:var(--chip); padding:0 16px;
}
.chip.on { background:#f1f1f1; color:#0f0f0f; }
ul { list-style:none; margin:0; padding:0; }
#list.rev { display:flex; flex-direction:column-reverse; }
li { content-visibility:auto; contain-intrinsic-size:auto 112px; }
li[hidden] { display:none; }
.row {
  display:grid; grid-template-columns:40px 168px 1fr 40px; gap:12px;
  align-items:start; width:100%; text-align:left; background:none; border:0;
  border-radius:12px; padding:8px 4px;
}
.row:hover,.row.on { background:#272727; }
.n { color:var(--muted); text-align:center; align-self:center; }
.th { position:relative; aspect-ratio:16/9; background:#222; border-radius:10px; overflow:hidden; }
.th img { width:100%; height:100%; object-fit:cover; display:block; }
.th em {
  position:absolute; right:4px; bottom:4px; background:#000c; font-style:normal;
  font-size:12px; padding:1px 4px; border-radius:4px;
}
.tx b {
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; font-size:18px; font-weight:500; line-height:1.3;
}
.tx small { display:block; margin-top:6px; color:var(--muted); font-size:14px; }
.dots { align-self:center; }
@media(max-width:560px) {
  .row { grid-template-columns:28px 120px 1fr; }
  .dots { display:none; }
  .tx b { font-size:15px; }
  h1 { font-size:26px; }
}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 4.33l7 6.12V20h-4v-6H9v6H5v-9.55l7-6.12M12 3L4 10v11h6v-6h4v6h6V10l-8-7z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-shuf" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><path d="M12 8a2 2 0 100-4 2 2 0 000 4zm0 2a2 2 0 100 4 2 2 0 000-4zm0 6a2 2 0 100 4 2 2 0 000-4z"/></symbol>
</svg>

<header class="top">
  <button class="ic" id="burger" type="button" aria-label="Menú"><svg class="i"><use href="#i-menu"/></svg></button>
  <div class="logo"><span class="lg"><svg class="i"><use href="#i-play"/></svg></span>MiTube</div>
  <form class="search" onsubmit="return false" role="search">
    <input id="q" type="search" placeholder="Buscar" aria-label="Buscar en la lista" autocomplete="off">
    <span><svg class="i"><use href="#i-search"/></svg></span>
  </form>
  <div class="av" id="av1">D</div>
</header>

<nav class="nav" id="nav" aria-label="Menú">
  <button type="button" id="nHome" class="act"><svg class="i"><use href="#i-home"/></svg>Mi lista</button>
  <button type="button" id="nShuf"><svg class="i"><use href="#i-shuf"/></svg><span id="nShufT">Aleatorio: sí</span></button>
</nav>

<main class="page">
  <section class="card">
    <div class="cover"><img id="cimg" alt=""></div>
    <h1 id="name">El Biza Alhaurino</h1>
    <div class="by"><span class="av" id="av2">D</span><span id="author">de David Bravo Rueda</span></div>
    <p class="meta" id="info">Lista de reproducción pública</p>
    <p class="desc" id="desc">Lista de reproducción musical</p>
    <div class="acts">
      <button class="white" id="play" type="button"><svg class="i"><use href="#i-play"/></svg>Reproducir</button>
      <button class="round" id="shufT" type="button" aria-pressed="true" aria-label="Aleatorio" title="Aleatorio"><svg class="i"><use href="#i-shuf"/></svg></button>
    </div>
    <div id="now" hidden>
      <div id="nt"></div>
      <div class="ctrl">
        <button id="prev" type="button">Anterior</button>
        <button id="next" type="button">Siguiente</button>
      </div>
    </div>
    <div id="msg" role="status" aria-live="polite"></div>
  </section>

  <section>
    <div class="chips">
      <select id="sort" aria-label="Ordenar">
        <option value="new">Fecha de inclusión (más recientes)</option>
        <option value="old">Fecha de inclusión (más antiguos)</option>
      </select>
      <button class="chip on" data-f="all" type="button">Todo</button>
      <button class="chip" data-f="vid" type="button">Vídeos</button>
      <button class="chip" data-f="sh" type="button">Shorts</button>
    </div>
    <ul id="list" aria-label="Canciones de la lista"></ul>
  </section>
</main>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var items = [], lis = [], rows = [], order = [];
  var pos = 0, shuffleOn = true, filt = "all", q = "";

  if (innerWidth >= 1100) document.body.classList.add("nav-open");

  $("burger").onclick = function () {
    document.body.classList.toggle("nav-open");
  };

  $("nHome").onclick = function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  function say(message) {
    $("msg").textContent = message || "";
  }

  function shuffle(array) {
    for (var i = array.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = array[i];
      array[i] = array[j];
      array[j] = temp;
    }
    return array;
  }

  function dur(seconds) {
    seconds = Math.max(0, seconds | 0);
    var h = (seconds / 3600) | 0;
    var m = ((seconds % 3600) / 60) | 0;
    var s = seconds % 60;
    return (h ? h + ":" + (m < 10 ? "0" : "") : "") +
      m + ":" + (s < 10 ? "0" : "") + s;
  }

  function fmtN(number) {
    if (!(number >= 0)) return "";
    if (number >= 1000000) return (number / 1000000).toFixed(1).replace(".", ",") + " M";
    if (number >= 1000) return (number / 1000).toFixed(1).replace(".", ",") + " K";
    return String(number);
  }

  function ago(timestamp) {
    if (!(timestamp > 0)) return "";
    var days = (Date.now() - timestamp) / 86400000;
    if (days < 1) return "hoy";
    if (days < 30) return "hace " + (days | 0) + " d";
    if (days < 365) return "hace " + ((days / 30) | 0) + " m";
    return "hace " + ((days / 365) | 0) + " a";
  }

  function apply() {
    items.forEach(function (item, index) {
      var matchesFilter =
        filt === "all" ||
        (filt === "vid" && !item.short) ||
        (filt === "sh" && item.short);

      var matchesQuery = !q ||
        (item.title + " " + item.by).toLowerCase().indexOf(q) !== -1;

      lis[index].hidden = !(matchesFilter && matchesQuery);
    });
  }

  function mk(tag, className, text) {
    var element = document.createElement(tag);
    if (className) element.className = className;
    if (text != null) element.textContent = text;
    return element;
  }

  function addRows(data) {
    var fragment = document.createDocumentFragment();

    data.forEach(function (item) {
      var index = items.length;
      items.push(item);

      var li = document.createElement("li");
      var button = mk("button", "row");
      button.type = "button";
      button.dataset.i = index;

      var thumbnail = mk("span", "th");
      if (item.thumb) {
        var image = document.createElement("img");
        image.loading = "lazy";
        image.alt = "";
        image.src = item.thumb;
        thumbnail.appendChild(image);
      }

      if (item.dur > 0) thumbnail.appendChild(mk("em", null, dur(item.dur)));

      var text = mk("span", "tx");
      text.appendChild(mk("b", null, item.title));
      text.appendChild(mk("small", null,
        [item.by, fmtN(item.views), ago(item.up)].filter(Boolean).join(" • ")
      ));

      var dots = mk("span", "dots");
      dots.innerHTML = '<svg class="i" aria-hidden="true"><use href="#i-dots"></use></svg>';

      button.appendChild(mk("span", "n", index + 1));
      button.appendChild(thumbnail);
      button.appendChild(text);
      button.appendChild(dots);
      li.appendChild(button);
      fragment.appendChild(li);

      lis[index] = li;
      rows[index] = button;
    });

    $("list").appendChild(fragment);
    apply();
  }

  function play(index) {
    if (!order.length) {
      say("La lista todavía no se ha cargado.");
      return;
    }

    pos = (index + order.length) % order.length;
    var itemIndex = order[pos];
    var item = items[itemIndex];

    rows.forEach(function (row) { row.classList.remove("on"); });

    if (rows[itemIndex]) {
      rows[itemIndex].classList.add("on");
      rows[itemIndex].scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    $("now").hidden = false;
    $("nt").textContent = item.title;
    $("cimg").src = item.thumb || "";

    // Conserva el ID de cada canción y abre su reproductor alternativo.
    var url = new URL("https://www.yout-ube.com/watch");
    url.searchParams.set("v", item.id);
    window.location.href = url.toString();
  }

  function startAt(first) {
    var all = items.map(function (_, index) { return index; });

    if (shuffleOn) {
      if (first >= 0) {
        var rest = all.filter(function (index) { return index !== first; });
        order = [first].concat(shuffle(rest));
      } else {
        order = shuffle(all);
      }
    } else {
      order = first >= 0 ?
        all.slice(first).concat(all.slice(0, first)) : all;
    }

    play(0);
  }

  function toggleShuf() {
    shuffleOn = !shuffleOn;
    $("shufT").setAttribute("aria-pressed", String(shuffleOn));
    $("nShufT").textContent = "Aleatorio: " + (shuffleOn ? "sí" : "no");
  }

  async function load() {
    say("Cargando la lista…");

    try {
      var response = await fetch("lista.json?" + Date.now(), { cache: "no-store" });
      if (!response.ok) throw new Error("No se pudo leer lista.json");

      var data = await response.json();

      if (data.title) {
        $("name").textContent = data.title;
        document.title = data.title;
      }

      if (data.uploader) {
        $("author").textContent = "de " + data.uploader;
        $("av2").textContent = $("av1").textContent =
          data.uploader.charAt(0).toUpperCase();
      }

      var list = (data.items || []).slice().reverse().map(function (item) {
        return {
          id: item.id,
          title: item.title || "Sin título",
          by: item.by || "",
          thumb: "https://i.ytimg.com/vi/" + item.id + "/mqdefault.jpg",
          dur: item.dur || 0,
          views: item.views,
          up: 0,
          short: item.dur > 0 && item.dur <= 60
        };
      });

      addRows(list);
      $("info").textContent = "Lista de reproducción pública • " + list.length + " vídeos";
      $("cimg").src = list.length ? list[0].thumb : "";
      say(list.length ? "" : "La lista está vacía.");
    } catch (error) {
      console.error(error);
      say("No se pudo cargar lista.json. Comprueba que está junto a index.html.");
    }
  }

  $("list").addEventListener("click", function (event) {
    var button = event.target.closest(".row");
    if (button) startAt(Number(button.dataset.i));
  });

  $("play").onclick = function () {
    if (!items.length) {
      load();
      return;
    }
    startAt(-1);
  };

  $("shufT").onclick = toggleShuf;
  $("nShuf").onclick = toggleShuf;
  $("next").onclick = function () { play(pos + 1); };
  $("prev").onclick = function () { play(pos - 1); };

  $("sort").onchange = function () {
    $("list").classList.toggle("rev", this.value === "old");
  };

  document.querySelectorAll(".chip").forEach(function (chip) {
    chip.onclick = function () {
      document.querySelectorAll(".chip").forEach(function (other) {
        other.classList.remove("on");
      });
      chip.classList.add("on");
      filt = chip.dataset.f;
      apply();
    };
  });

  $("q").addEventListener("input", function () {
    q = this.value.trim().toLowerCase();
    apply();
  });

  load();
})();
</script>
</body>
</html>
