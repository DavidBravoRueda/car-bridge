
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>El Biza</title>

<style>
:root {
  --bg:#0f0f0f;
  --chip:#272727;
  --hover:#272727;
  --ink:#f1f1f1;
  --muted:#aaa;
  --line:#303030;
  color-scheme:dark;
}
* { box-sizing:border-box }
[hidden] { display:none !important }
body {
  margin:0;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  background:var(--bg);
  color:var(--ink);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
button,input,select { font:inherit;color:inherit }
button { cursor:pointer }
.i { width:24px;height:24px;fill:currentColor;flex:none }
.top {
  position:sticky;top:0;z-index:5;height:56px;
  background:var(--bg);display:flex;align-items:center;
  gap:16px;padding:0 16px
}
.ic {
  width:40px;height:40px;border:0;border-radius:50%;
  background:none;display:grid;place-items:center
}
.ic:hover { background:var(--hover) }
.logo {
  display:flex;align-items:center;gap:6px;
  font-weight:700;font-size:20px
}
.lg {
  width:30px;height:21px;background:red;border-radius:6px;
  display:grid;place-items:center
}
.search {
  flex:1;max-width:640px;margin:auto;display:flex;height:40px
}
.search input {
  flex:1;min-width:0;background:#121212;
  border:1px solid var(--line);border-radius:40px 0 0 40px;
  padding:0 16px
}
.search span {
  width:56px;background:#222;border:1px solid var(--line);
  border-radius:0 40px 40px 0;display:grid;place-items:center
}
.av {
  width:32px;height:32px;border-radius:50%;background:#1e6fd9;
  display:grid;place-items:center;font-weight:600;flex:none
}
.nav {
  position:fixed;top:56px;left:0;bottom:0;width:240px;
  padding:12px;background:var(--bg);transform:translateX(-100%);
  transition:transform .18s;z-index:4
}
body.nav-open .nav { transform:none }
.nav button {
  display:flex;align-items:center;gap:22px;width:100%;
  padding:0 12px;height:40px;border:0;border-radius:10px;
  background:none;text-align:left
}
.nav button:hover,.nav .act { background:var(--hover) }
.page {
  display:grid;grid-template-columns:minmax(280px,32%) 1fr;
  gap:24px;padding:16px 24px 40px
}
@media(min-width:1100px) {
  body.nav-open .page { margin-left:240px }
}
@media(max-width:820px) {
  .page { grid-template-columns:1fr;padding:12px }
}
.card {
  background:linear-gradient(180deg,#4a4a4c,#262626 55%,#1c1c1c);
  border-radius:24px;padding:24px;align-self:start;
  position:sticky;top:72px
}
@media(max-width:820px) {
  .card { position:static }
}
.cover {
  position:relative;aspect-ratio:16/9;border-radius:16px;
  overflow:hidden;background:#000
}
.cover img,.cover video {
  width:100%;height:100%;object-fit:contain;display:block
}
h1 { font-size:30px;line-height:1.15;margin:20px 0 12px }
.by { display:flex;align-items:center;gap:8px;font-weight:600 }
.by .av { width:28px;height:28px }
.meta,.desc { color:#d0d0d0;font-size:14px }
.acts { display:flex;gap:10px;align-items:center }
.white {
  display:flex;align-items:center;gap:8px;height:48px;
  padding:0 20px;border:0;border-radius:999px;
  background:#f1f1f1;color:#111;font-weight:600
}
.round {
  width:48px;height:48px;border:0;border-radius:50%;
  background:#383838;display:grid;place-items:center
}
.round[aria-pressed="true"] { background:#eee;color:#111 }
#now { margin-top:16px }
#nt { font-weight:600;margin-bottom:10px }
.ctrl { display:grid;grid-template-columns:1fr 1fr;gap:10px }
.ctrl button {
  height:44px;border:0;border-radius:999px;background:#383838
}
#msg { min-height:20px;margin-top:12px;font-size:13px;color:#ddd }
.chips { display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px }
.chip,select {
  height:40px;border:0;border-radius:10px;background:var(--chip);
  padding:0 12px
}
.chip.on { background:#f1f1f1;color:#111 }
ul { list-style:none;margin:0;padding:0 }
#list.rev { display:flex;flex-direction:column-reverse }
li[hidden] { display:none }
.row {
  display:grid;grid-template-columns:32px minmax(100px,168px) 1fr;
  gap:12px;align-items:start;width:100%;text-align:left;
  background:none;border:0;border-radius:12px;padding:8px 4px
}
.row:hover,.row.on { background:var(--hover) }
.n { color:var(--muted);text-align:center;align-self:center }
.th {
  position:relative;display:block;aspect-ratio:16/9;
  background:#222;border-radius:10px;overflow:hidden
}
.th img { width:100%;height:100%;object-fit:cover;display:block }
.th em {
  position:absolute;right:4px;bottom:4px;background:#000c;
  font-style:normal;font-size:12px;padding:1px 4px
}
.tx b {
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;font-size:16px;font-weight:500
}
.tx small { display:block;margin-top:6px;color:var(--muted) }
@media(max-width:480px) {
  .page { padding:10px }
  .card { padding:16px }
  .row { grid-template-columns:24px 110px 1fr;gap:8px }
  .tx b { font-size:14px }
  .logo { font-size:16px }
  .top { gap:8px;padding:0 8px }
}
</style>
</head>

<body>
<svg hidden aria-hidden="true">
  <symbol id="menu" viewBox="0 0 24 24">
    <path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/>
  </symbol>
  <symbol id="search" viewBox="0 0 24 24">
    <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
  </symbol>
  <symbol id="play" viewBox="0 0 24 24">
    <path d="M8 5v14l11-7z"/>
  </symbol>
  <symbol id="shuffle" viewBox="0 0 24 24">
    <path d="M17 3h4v6h-2V6.41l-4.3 4.3-1.4-1.42L17.59 5H17zM3 7h4l10 10h2v-3h2v5h-5v-2h-1L5 9H3zm0 10h4l2-2 1.4 1.4L7.8 19H3z"/>
  </symbol>
</svg>

<header class="top">
  <button class="ic" id="burger" aria-label="Menú">
    <svg class="i"><use href="#menu"/></svg>
  </button>
  <div class="logo">
    <span class="lg"><svg class="i"><use href="#play"/></svg></span>
    MiTube
  </div>
  <form class="search" onsubmit="return false">
    <input id="q" type="search" placeholder="Buscar canciones" autocomplete="off">
    <span><svg class="i"><use href="#search"/></svg></span>
  </form>
  <div class="av" id="av1">D</div>
</header>

<nav class="nav">
  <button id="nHome" class="act">Mi lista</button>
  <button id="nShuf">Aleatorio: sí</button>
</nav>

<main class="page">
  <section class="card">
    <div class="cover">
      <img id="cimg" alt="">
      <video id="v" controls playsinline webkit-playsinline preload="metadata" hidden></video>
    </div>

    <h1 id="name">El Biza Alhaurino</h1>
    <div class="by">
      <span class="av" id="av2">D</span>
      <span id="author">David Bravo Rueda</span>
    </div>

    <p class="meta" id="info">Cargando lista…</p>
    <p class="desc">Lista de reproducción</p>

    <div class="acts">
      <button class="white" id="play">
        <svg class="i"><use href="#play"/></svg>Reproducir
      </button>
      <button class="round" id="shufT" aria-pressed="true" aria-label="Aleatorio">
        <svg class="i"><use href="#shuffle"/></svg>
      </button>
    </div>

    <div id="now" hidden>
      <div id="nt"></div>
      <div class="ctrl">
        <button id="prev">Anterior</button>
        <button id="next">Siguiente</button>
      </div>
    </div>
    <div id="msg" role="status"></div>
  </section>

  <section>
    <div class="chips">
      <select id="sort" aria-label="Orden">
        <option value="new">Más recientes</option>
        <option value="old">Más antiguos</option>
      </select>
      <button class="chip on" data-f="all">Todo</button>
      <button class="chip" data-f="vid">Vídeos</button>
      <button class="chip" data-f="sh">Shorts</button>
    </div>
    <ul id="list"></ul>
  </section>
</main>

<script>
(function () {
  "use strict";

  const API_LIST = [
    "https://pipedapi.adminforge.de",
    "https://api.piped.private.coffee",
    "https://pipedapi.leptons.xyz"
  ];

  const $ = id => document.getElementById(id);
  const video = $("v");
  const listEl = $("list");

  let items = [];
  let rows = [];
  let lis = [];
  let order = [];
  let pos = 0;
  let shuffleOn = true;
  let filt = "all";
  let query = "";
  let playToken = 0;
  let userStarted = false;

  if (innerWidth >= 1100) {
    document.body.classList.add("nav-open");
  }

  $("burger").onclick = () =>
    document.body.classList.toggle("nav-open");

  $("nHome").onclick = () =>
    window.scrollTo({top:0,behavior:"smooth"});

  function say(message) {
    $("msg").textContent = message;
  }

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function formatDuration(seconds) {
    seconds = Math.max(0, Number(seconds) || 0);
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);

    return (hours ? hours + ":" + String(minutes).padStart(2,"0") : minutes)
      + ":" + String(secs).padStart(2,"0");
  }

  function formatViews(number) {
    if (!(number >= 0)) return "";
    if (number >= 1e6) return (number / 1e6).toFixed(1) + " M";
    if (number >= 1000) return Math.round(number / 1000) + " K";
    return String(number);
  }

  function applyFilters() {
    items.forEach((item, index) => {
      const matchesType =
        filt === "all" ||
        (filt === "vid" && !item.short) ||
        (filt === "sh" && item.short);

      const text = (item.title + " " + item.by).toLowerCase();
      lis[index].hidden = !(matchesType && text.includes(query));
    });
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function renderItems(data) {
    const fragment = document.createDocumentFragment();

    data.forEach(item => {
      const index = items.length;
      items.push(item);

      const li = document.createElement("li");
      const button = element("button","row");
      button.type = "button";
      button.dataset.i = index;

      const thumb = element("span","th");

      const image = document.createElement("img");
      image.loading = "lazy";
      image.alt = "";
      image.src = item.thumb;
      thumb.appendChild(image);

      if (item.dur > 0) {
        thumb.appendChild(element("em",null,formatDuration(item.dur)));
      }

      const text = element("span","tx");
      text.appendChild(element("b",null,item.title));

      const details = [
        item.by,
        formatViews(item.views)
      ].filter(Boolean).join(" • ");

      text.appendChild(element("small",null,details));

      button.append(
        element("span","n",index + 1),
        thumb,
        text
      );

      li.appendChild(button);
      fragment.appendChild(li);
      lis[index] = li;
      rows[index] = button;
    });

    listEl.appendChild(fragment);
    applyFilters();
  }

  async function loadList() {
    say("Cargando lista…");

    try {
      const response = await fetch("./lista.json?t=" + Date.now(), {
        cache:"no-store"
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();

      if (!Array.isArray(data.items)) {
        throw new Error("Formato JSON incorrecto");
      }

      if (data.title) {
        $("name").textContent = data.title;
        document.title = data.title;
      }

      if (data.uploader) {
        $("author").textContent = data.uploader;
        $("av1").textContent = data.uploader[0].toUpperCase();
        $("av2").textContent = data.uploader[0].toUpperCase();
      }

      const parsed = data.items
        .filter(item => item && /^[\w-]{11}$/.test(item.id))
        .slice()
        .reverse()
        .map(item => ({
          id:item.id,
          title:item.title || "Sin título",
          by:item.by || "",
          thumb:"https://i.ytimg.com/vi/" + item.id + "/mqdefault.jpg",
          dur:Number(item.dur) || 0,
          views:Number(item.views) || 0,
          short:Number(item.dur) > 0 && Number(item.dur) <= 60
        }));

      renderItems(parsed);

      $("info").textContent =
        "Lista de reproducción • " + parsed.length + " vídeos";

      if (parsed.length) {
        $("cimg").src = parsed[0].thumb;
        say("Lista cargada: " + parsed.length + " canciones.");
      } else {
        say("La lista no contiene vídeos válidos.");
      }
    } catch (error) {
      console.error(error);
      say("No se pudo cargar lista.json. Comprueba el archivo.");
    }
  }

  async function requestStreams(id) {
    let lastError;

    for (const base of API_LIST) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 9000);

      try {
        const response = await fetch(
          base + "/streams/" + encodeURIComponent(id),
          {signal:controller.signal}
        );

        if (!response.ok) {
          throw new Error("Servidor HTTP " + response.status);
        }

        return await response.json();
      } catch (error) {
        lastError = error;
      } finally {
        clearTimeout(timeout);
      }
    }

    throw lastError || new Error("No hay servidores disponibles");
  }

  function chooseStream(data) {
    const streams = (data.videoStreams || [])
      .filter(stream => {
        const type = stream.mimeType || stream.format || "";
        return !stream.videoOnly && /video\/mp4/i.test(type);
      })
      .sort((a,b) =>
        (b.height || 0) - (a.height || 0)
      );

    if (streams.length) return streams[0].url;

    // HLS solo se usa cuando el servidor lo ofrece.
    return data.hls || data.hlsUrl || null;
  }

  async function play(index) {
    if (!order.length) {
      say("La lista está vacía.");
      return;
    }

    pos = (index + order.length) % order.length;
    const token = ++playToken;
    const item = items[order[pos]];

    rows.forEach(row => row.classList.remove("on"));

    const row = rows[order[pos]];
    if (row) {
      row.classList.add("on");
      row.scrollIntoView({block:"nearest",behavior:"smooth"});
    }

    $("now").hidden = false;
    $("nt").textContent = item.title;
    $("cimg").hidden = true;
    video.hidden = false;

    // Detener la pista anterior sin activar el siguiente tema.
    video.pause();
    video.removeAttribute("src");
    video.load();

    say("Cargando: " + item.title);

    try {
      const data = await requestStreams(item.id);

      if (token !== playToken) return;

      const url = chooseStream(data);

      if (!url) {
        throw new Error("No hay un formato MP4 compatible disponible");
      }

      video.src = url;
      video.load();

      try {
        await video.play();
      } catch (error) {
        if (token !== playToken) return;

        if (error.name === "NotAllowedError") {
          say("Safari bloqueó el inicio automático. Pulsa ▶ en el vídeo.");
        } else {
          say("No se pudo iniciar el vídeo. Comprueba la conexión.");
        }
        return;
      }

      if (token !== playToken) {
        video.pause();
        return;
      }

      say("");

      if ("mediaSession" in navigator &&
          typeof MediaMetadata !== "undefined") {
        navigator.mediaSession.metadata = new MediaMetadata({
          title:item.title,
          artist:item.by || "El Biza Alhaurino"
        });

        navigator.mediaSession.setActionHandler("nexttrack",() => play(pos + 1));
        navigator.mediaSession.setActionHandler("previoustrack",() => play(pos - 1));
      }
    } catch (error) {
      if (token !== playToken) return;
      console.error("Error de reproducción:",error);
      say("No se pudo cargar esta canción. Pulsa Siguiente para continuar.");
    }
  }

  function startAt(first) {
    if (!items.length) {
      say("No hay canciones disponibles.");
      return;
    }

    const all = items.map((_,index) => index);

    if (shuffleOn) {
      const rest = all.filter(index => index !== first);
      order = first >= 0
        ? [first].concat(shuffle(rest))
        : shuffle(all);
    } else {
      order = first >= 0
        ? all.slice(first).concat(all.slice(0,first))
        : all;
    }

    userStarted = true;
    play(0);
  }

  function toggleShuffle() {
    shuffleOn = !shuffleOn;
    $("shufT").setAttribute("aria-pressed",String(shuffleOn));
    $("nShuf").textContent = "Aleatorio: " + (shuffleOn ? "sí" : "no");
  }

  listEl.addEventListener("click", event => {
    const button = event.target.closest(".row");
    if (button) startAt(Number(button.dataset.i));
  });

  $("play").onclick = () => {
    if (!items.length) return;
    startAt(-1);
  };

  $("shufT").onclick = toggleShuffle;
  $("nShuf").onclick = toggleShuffle;

  $("next").onclick = () => play(pos + 1);
  $("prev").onclick = () => play(pos - 1);

  $("sort").onchange = event => {
    listEl.classList.toggle("rev",event.target.value === "old");
  };

  document.querySelectorAll(".chip").forEach(chip => {
    chip.onclick = () => {
      document.querySelectorAll(".chip").forEach(other =>
        other.classList.remove("on")
      );
      chip.classList.add("on");
      filt = chip.dataset.f;
      applyFilters();
    };
  });

  $("q").addEventListener("input",event => {
    query = event.target.value.trim().toLowerCase();
    applyFilters();
  });

  // Solo avanzar cuando el vídeo haya terminado normalmente.
  // Un error de red NO provoca una cadena infinita de saltos.
  video.addEventListener("ended",() => {
    if (userStarted) play(pos + 1);
  });

  video.addEventListener("playing",() => say(""));

  video.addEventListener("error",() => {
    if (video.currentSrc) {
      say("Error de vídeo. No se saltará automáticamente.");
    }
  });

  loadList();
})();
</script>
</body>
</html>
