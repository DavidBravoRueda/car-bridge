<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Bridge Playlist</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background-color: #000000; overflow: hidden; }
        
        /* Contenedor principal a pantalla completa */
        #player-container { width: 100%; height: 100%; position: relative; }
        
        /* Pantalla negra absoluta que cubre todo hasta que el vídeo arranca */
        #loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            z-index: 10;
        }

        iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

    <div id="player-container">
        <!-- Pantalla negra fija que oculta cualquier carga lenta -->
        <div id="loader"></div>
        
        <!-- El reproductor de YouTube incrustado mediante API limpia -->
        <div id="player"></div>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'listType': 'playlist',
                    'list': 'PLPBl-I93G56Y',
                    'autoplay': 1,
                    'shuffle': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'controls': 1
                },
                events: {
                    'onReady': function(event) {
                        event.target.playVideo();
                    },
                    'onStateChange': function(event) {
                        // En cuanto el reproductor empieza a reproducir de verdad, 
                        // borramos el fondo negro al instante de golpe
                        if (event.data == YT.PlayerState.PLAYING) {
                            var loader = document.getElementById('loader');
                            if (loader) {
                                loader.style.display = 'none';
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
